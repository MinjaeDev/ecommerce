spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/ecommerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # prod에서는 절대 update/create 쓰면 안 됨
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  elasticsearch:
    uris: http://${ES_HOST}:9200
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:9092

springdoc:
  api-docs:
    enabled: false              # prod에서는 Swagger 비활성화
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

# jwt 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000