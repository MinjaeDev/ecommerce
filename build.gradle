plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.minjae'
version = '0.0.1-SNAPSHOT'
description = 'ecommerce'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ── Spring Boot Starters ──────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'org.springframework.kafka:spring-kafka'

    // ── DB ────────────────────────────────────────────────────────────────
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ── QueryDSL (Spring Boot 3.x Jakarta 필수) ───────────────────────────
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // ── JWT ───────────────────────────────────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // ── Swagger / OpenAPI ─────────────────────────────────────────────────
    // Spring Boot 3.x → springdoc v2.x 사용 (v3.x 아님 주의)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // ── Redis + 분산 락 ───────────────────────────────────────────────────
    // redisson-spring-boot-starter가 spring-data-redis를 포함
    // Lettuce 대신 Redisson이 RedisConnectionFactory 담당
    implementation 'org.redisson:redisson-spring-boot-starter:3.40.0'

    // ── Lombok ────────────────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── uuid v7 ───────────────────────────
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'

    // ── Test ─────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// ── QueryDSL Q클래스 생성 경로 ────────────────────────────────────────────
def generatedDir = 'src/main/generated'

sourceSets {
    main.java.srcDirs += [generatedDir]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(generatedDir))
}

clean {
    delete file(generatedDir)
}

tasks.named('test') {
    useJUnitPlatform()
}
